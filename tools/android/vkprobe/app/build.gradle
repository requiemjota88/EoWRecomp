plugins {
    id 'com.android.application'
}

android {
    namespace 'com.requiemjota88.vkprobe'
    compileSdk 36

    defaultConfig {
        applicationId 'com.requiemjota88.vkprobe'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags ''; arguments '-DANDROID_STL=none' }
        }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }
}
