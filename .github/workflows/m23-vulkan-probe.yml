name: M23 Vulkan capability probe

on:
  push:
    branches: [m23-optimization]
    paths:
      - 'tools/android/vkprobe/**'
      - '.github/workflows/m23-vulkan-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package no longer exists in Google's SDK repository.
          packages: platform-tools
      - name: Install Android NDK and CMake
        run: sdkmanager --install 'platforms;android-36' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build diagnostic APK
        run: gradle --no-daemon -p tools/android/vkprobe :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: EoW-M23-Vulkan-Probe
          path: tools/android/vkprobe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
