name: M23 Android experimental APK

on:
  push:
    branches:
      - m23-vulkan11-experiment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m23-android-experimental-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm yasm python3 perl unzip zip

      - name: Cache Android native dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/android/src
            build/android/deps
            build/android/SDL3
          key: m23-android-deps-v1-${{ runner.os }}-${{ hashFiles('tools/android/build_deps.sh') }}
          restore-keys: |
            m23-android-deps-v1-${{ runner.os }}-

      - name: Build pinned Android dependencies
        run: bash tools/android/build_deps.sh

      - name: Assemble experimental APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EoWRecomp-M23-Experimental-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
